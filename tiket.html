<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="description" content="Pilih tiket untuk Gadjah Mada Run 2026. Dapatkan tiket terbaikmu sebelum habis!">
<meta name="theme-color" content="#4f46e5">
<meta property="og:title" content="Tiket - Gadjah Mada Run 2026">
<meta property="og:description" content="Pilih tiket Reguler 3K atau 5K Gadjah Mada Run 2026. Maksimal 5 tiket per pesanan.">
<meta property="og:type" content="website">
<title>Pilih Tiket - Gadjah Mada Run 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
<style>
:root{--blue:#4f46e5;--blue-deep:#3730a3;--blue-light:#eef2ff;--text:#0f172a;--text-soft:#475569;--border:#e2e8f0;--bg:#f8fafc;--card:#fff;--green:#10b981;--shadow-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);--radius:18px;--ease:cubic-bezier(.4,0,.2,1);--ease-bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,rgba(99,102,241,.08),transparent 60%),radial-gradient(800px 400px at 100% 100%,rgba(245,158,11,.06),transparent 60%),#f5f7fb;color:var(--text);font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.app{width:100%;max-width:920px;margin:0 auto;background:linear-gradient(180deg,#fff 0%,#fbfcff 100%);min-height:100vh;padding-bottom:120px}
.topbar{height:88px;display:flex;align-items:center;gap:22px;padding:0 38px;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(226,232,240,.6)}
.back{border:0;background:linear-gradient(135deg,#f1f5f9,#e2e8f0);line-height:1;cursor:pointer;color:var(--text);padding:0;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;transition:all .25s var(--ease-bounce);box-shadow:var(--shadow-sm)}
.back:hover{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;transform:translateY(-2px) scale(1.05);box-shadow:0 8px 20px rgba(79,70,229,.35)}
.back:active{transform:translateY(0) scale(.96)}
.topbar h1{font-size:30px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--text) 0%,var(--blue-deep) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.coupon{padding:16px 38px;font-size:13px;color:var(--text-soft);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-bottom:1px solid rgba(226,232,240,.6)}
.coupon svg{width:16px;height:16px;color:var(--blue);flex:none}
.info-box{margin:24px 38px;padding:16px;background:linear-gradient(135deg,var(--blue-light),#fff);border:1px solid #c7d2fe;border-radius:14px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.5;font-weight:600;color:var(--text-soft);box-shadow:var(--shadow-sm)}
.info-icon{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--blue);box-shadow:var(--shadow-sm);flex:none}
.ticket-list{padding:0 38px;display:flex;flex-direction:column;gap:20px;margin-top:10px}
.ticket-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:22px;position:relative;transition:all .3s var(--ease);box-shadow:var(--shadow-sm)}
.ticket-card.active{border:2px solid var(--blue);box-shadow:0 8px 24px rgba(79,70,229,.18);overflow:hidden}
.ticket-card.active:hover{box-shadow:0 12px 32px rgba(79,70,229,.25)}
.ticket-card.available{border-top:5px solid #1d39c4}
.ticket-card.sold-out{background:#fff;border-color:#94a3b8;border-top:5px solid #999}
.ticket-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.ticket-info h3{font-size:17px;font-weight:800;margin-bottom:4px;letter-spacing:-.01em}
.ticket-price{font-size:15px;font-weight:700;color:var(--blue-deep)}
.status-badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex:none;display:inline-flex;align-items:center;gap:6px}
.status-available{background:#d1fae5;color:var(--green)}
.status-available::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulseDot 2s infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}
.ticket-card.sold-out .status-badge{background:transparent;font-size:16px;color:#bd1111}
.ticket-card.sold-out:last-child .status-badge{color:#444}
.quantity-wrapper[hidden]{display:none!important}
.choose-row{margin-top:16px;display:flex;justify-content:flex-end}
.choose-btn{background:#1d39c4;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer}
.choose-btn:hover{background:#142b99}
.quantity-wrapper{margin:22px -22px 0;padding:22px 22px 0;border-top:2px dashed #cbd5e1;position:relative;display:flex;align-items:center;justify-content:space-between}
.ticket-card.active .quantity-wrapper::before,.ticket-card.active .quantity-wrapper::after{content:'';position:absolute;top:-16px;width:32px;height:32px;background:var(--bg);border-radius:50%;z-index:10}
.ticket-card.active .quantity-wrapper::before{left:-16px}
.ticket-card.active .quantity-wrapper::after{right:-16px}
.quantity-label{font-size:13px;font-weight:600;color:var(--text-soft)}
.quantity-controls{display:flex;align-items:center;gap:10px}
.qty-btn{width:34px;height:34px;border-radius:8px;border:none;background:var(--blue-light);color:var(--blue);cursor:pointer;display:grid;place-items:center;transition:all .2s var(--ease-bounce)}
.qty-btn:hover:not(:disabled){background:var(--blue);color:#fff;transform:scale(1.05)}
.qty-btn:active:not(:disabled){transform:scale(.95)}
.qty-btn:disabled{opacity:.4;cursor:not-allowed}
.qty-number{min-width:32px;text-align:center;font-size:15px;font-weight:800;color:var(--text)}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(920px,100%);background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(226,232,240,.6);padding:16px 38px 20px;z-index:50;box-shadow:0 -8px 32px rgba(15,23,42,.08)}
.checkout-btn{width:100%;height:52px;border:0;border-radius:14px;background:#e2e8f0;color:#94a3b8;font-size:17px;font-weight:800;cursor:not-allowed;position:relative;overflow:hidden;transition:all .25s var(--ease);font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.checkout-btn.active{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-deep) 100%);color:#fff;cursor:pointer;box-shadow:0 12px 28px rgba(79,70,229,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.checkout-btn.active::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .6s var(--ease)}
.checkout-btn.active:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(79,70,229,.45),inset 0 1px 0 rgba(255,255,255,.2)}
.checkout-btn.active:hover::before{left:100%}
.checkout-btn.active:active{transform:translateY(0) scale(.99)}
.checkout-btn svg{width:18px;height:18px}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.reveal.visible{opacity:1;transform:translateY(0)}
@media (max-width:600px){
  .topbar{height:72px;padding:0 18px;gap:14px}
  .topbar h1{font-size:20px}
  .back{width:40px;height:40px;border-radius:12px}
  .coupon{padding:14px 18px;font-size:12px}
  .info-box{margin:20px 18px;padding:14px;gap:10px;font-size:12px}
  .ticket-list{padding:0 18px;gap:16px}
  .ticket-card{padding:16px}
  .ticket-info h3{font-size:16px}
  .quantity-wrapper{margin:18px -16px 0;padding:18px 16px 0}
  .bottom{padding:12px 18px 16px}
  .checkout-btn{height:48px;font-size:16px}
}
@supports (padding:max(0px)){.bottom{padding-bottom:max(20px,env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <button class="back" type="button" aria-label="Kembali ke halaman sebelumnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Pilih Tiket</h1>
  </header>

  <div class="coupon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12V8H4v4M20 12v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4M20 12h-4a2 2 0 0 0 0 4h4"/></svg>
    Punya kode kupon? Fitur kupon belum tersedia.
  </div>

  <div class="info-box reveal"><div class="info-icon" aria-hidden="true">🎟️</div><div>Pilih tiket Reguler 3K atau 5K. Maksimal 5 tiket per pesanan.</div></div>

  <section class="ticket-list" aria-label="Daftar kategori tiket">
    <article class="ticket-card available reveal" data-ticket="0">
      <div class="ticket-header"><div class="ticket-info"><h3>REGULER 5K</h3><div class="ticket-price">Rp 160.000</div></div><span class="status-badge status-available">Available</span></div>
      <div class="choose-row"><button type="button" class="choose-btn" data-choose="0" aria-expanded="false">Pilih Tiket</button></div>
      <div class="quantity-wrapper" id="quantity-0" hidden><span class="quantity-label">Jumlah Tiket</span><div class="quantity-controls"><button type="button" class="qty-btn" data-minus="0" aria-label="Kurangi REGULER 5K">−</button><span class="qty-number" data-qty="0" aria-live="polite">0</span><button type="button" class="qty-btn" data-plus="0" aria-label="Tambah REGULER 5K">+</button></div></div>
    </article>
    <article class="ticket-card available reveal" data-ticket="1">
      <div class="ticket-header"><div class="ticket-info"><h3>REGULER 3K</h3><div class="ticket-price">Rp 140.000</div></div><span class="status-badge status-available">Available</span></div>
      <div class="choose-row"><button type="button" class="choose-btn" data-choose="1" aria-expanded="false">Pilih Tiket</button></div>
      <div class="quantity-wrapper" id="quantity-1" hidden><span class="quantity-label">Jumlah Tiket</span><div class="quantity-controls"><button type="button" class="qty-btn" data-minus="1" aria-label="Kurangi REGULER 3K">−</button><span class="qty-number" data-qty="1" aria-live="polite">0</span><button type="button" class="qty-btn" data-plus="1" aria-label="Tambah REGULER 3K">+</button></div></div>
    </article>
    <article class="ticket-card sold-out reveal" data-ticket="2">
      <div class="ticket-header"><div class="ticket-info"><h3>EARLY BIRD 5K</h3><div class="ticket-price">Rp 135.000</div></div><span class="status-badge status-sold">Habis</span></div>
    </article>
    <article class="ticket-card sold-out reveal" data-ticket="3">
      <div class="ticket-header"><div class="ticket-info"><h3>EARLY BIRD 3K</h3><div class="ticket-price">Rp 120.000</div></div><span class="status-badge status-sold">Ditutup</span></div>
    </article>
  </section>

</div>

<div class="bottom">
  <button type="button" id="checkoutButton" class="checkout-btn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span id="checkoutLabel">Checkout</span>
  </button>
</div>

<script>
'use strict';
const tickets=[{name:'REGULER 5K',price:160000},{name:'REGULER 3K',price:140000}];
const quantities=[0,0],maxTickets=5;
const checkout=document.getElementById('checkoutButton');
const checkoutLabel=document.getElementById('checkoutLabel');
document.querySelector('.back').addEventListener('click',()=>history.back());
const rupiah=n=>'Rp '+n.toLocaleString('id-ID');
const count=()=>quantities.reduce((a,b)=>a+b,0);
function render(){
  tickets.forEach((ticket,i)=>{
    const q=quantities[i],panel=document.getElementById('quantity-'+i),choose=document.querySelector(`[data-choose="${i}"]`);
    document.querySelector(`[data-qty="${i}"]`).textContent=q;
    document.querySelector(`[data-minus="${i}"]`).disabled=q===0;
    document.querySelector(`[data-plus="${i}"]`).disabled=count()>=maxTickets;
    const shown=!panel.hidden;
    choose.textContent=shown?'Tutup Pilihan':'Pilih Tiket';
    choose.setAttribute('aria-expanded',String(shown));
    document.querySelector(`[data-ticket="${i}"]`).classList.toggle('active',q>0);
  });
  const total=tickets.reduce((sum,t,i)=>sum+t.price*quantities[i],0);
  checkout.disabled=count()===0;
  checkout.classList.toggle('active',count()>0);
  checkoutLabel.textContent=count()?`Checkout • ${count()} tiket • ${rupiah(total)}`:'Checkout';
}
document.querySelectorAll('[data-choose]').forEach(btn=>btn.addEventListener('click',()=>{
  const i=Number(btn.dataset.choose),panel=document.getElementById('quantity-'+i);
  panel.hidden=!panel.hidden;
  render();
}));
document.querySelectorAll('[data-plus]').forEach(btn=>btn.addEventListener('click',()=>{
  const i=Number(btn.dataset.plus);
  if(count()<maxTickets){quantities[i]++;render();}
}));
document.querySelectorAll('[data-minus]').forEach(btn=>btn.addEventListener('click',()=>{
  const i=Number(btn.dataset.minus);
  if(quantities[i]>0){quantities[i]--;render();}
}));
checkout.addEventListener('click',()=>{
  if(!count())return;
  const selected=tickets.map((t,i)=>({...t,qty:quantities[i]})).filter(t=>t.qty>0);
  const total=selected.reduce((sum,t)=>sum+t.price*t.qty,0);
  localStorage.setItem('gmr_cart',JSON.stringify(selected));
  localStorage.setItem('jumlahTiket',String(count()));
  localStorage.setItem('kategoriTiket',selected.map(t=>t.name).join(' + '));
  localStorage.setItem('hargaTiket',selected.length===1?String(selected[0].price):'0');
  localStorage.setItem('gmr_total',String(total));
  window.location.href='form.html';
});
if('IntersectionObserver' in window){
  const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}}));
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}else{
  document.querySelectorAll('.reveal').forEach(el=>el.classList.add('visible'));
}
render();
</script>
</body>
</html>
